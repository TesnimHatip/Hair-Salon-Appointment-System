<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - SalonRandevu</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">SalonRandevu</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Ana Sayfa</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="salons.html">Salonlar</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="aboutUs.html">Hakkımızda</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">İletişim</a>
          </li>
        </ul>

        <div class="d-flex gap-2 navbar-auth-buttons">
          <a href="register.html" class="btn purple-btn">Kayıt Ol</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="auth-premium-section">
    <div class="container">

      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">

          <div class="auth-premium-card">

            <div class="auth-icon">
              <i class="fa-solid fa-user-lock"></i>
            </div>

            <h3 class="text-center fw-bold mt-3 mb-2">Giriş Yap</h3>

            <p class="text-center text-muted mb-4">
              Hesabınıza giriş yaparak randevularınızı yönetebilirsiniz.
            </p>

            <form>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-envelope text-purple me-1"></i>
                  E-posta
                </label>

                <input type="email" class="form-control" id="loginEmail" placeholder="E-posta adresinizi giriniz">
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-lock text-purple me-1"></i>
                  Şifre
                </label>

                <input type="password" class="form-control" id="loginPassword" placeholder="Şifrenizi giriniz">
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                  <input type="checkbox" id="remember">
                  <label for="remember" class="small">Beni Hatırla</label>
                </div>

                <a href="#" class="small text-purple text-decoration-none fw-semibold" onclick="forgotPassword()">
                  Şifremi Unuttum?
                </a>
              </div>

              <button type="button" class="btn purple-btn w-100 auth-submit-btn" onclick="loginUser()">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Giriş Yap
              </button>

            </form>

            <div class="auth-bottom-text">
              Hesabınız yok mu?
              <a href="register.html">Kayıt Ol</a>
            </div>

          </div>

        </div>
      </div>

    </div>
  </section>

  <script>
    async function loginUser() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      if (email === "" || password === "") {
        alert("Lütfen e-posta ve şifre alanlarını doldurunuz.");
        return;
      }

      const loginData = {
        email: email,
        password: password
      };

      try {
        const response = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(loginData)
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Giriş sırasında hata oluştu.");
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        if (data.user.role === "customer") {
          window.location.href = "customer-dashboard.html";
        } else if (data.user.role === "owner") {
          window.location.href = "owner-dashboard.html";
        } else if (data.user.role === "admin") {
          window.location.href = "admin-dashboard.html";
        }
      } catch (error) {
        alert("Backend bağlantı hatası.");
      }
    }
    function forgotPassword() {
  alert("Şifre yenileme özelliği şu anda aktif değildir. Lütfen sistem yöneticisi ile iletişime geçiniz.");
}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
