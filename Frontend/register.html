<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - SalonRandevu</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">SalonRandevu</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Ana Sayfa</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="salons.html">Salonlar</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="aboutUs.html">Hakkımızda</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">İletişim</a>
          </li>
        </ul>

        <div class="d-flex gap-2 navbar-auth-buttons">
          <a href="login.html" class="btn outline-purple-btn">Giriş Yap</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Register Section -->
  <section class="auth-premium-section">
    <div class="container">

      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9">

          <div class="auth-premium-card">

            <div class="auth-icon">
              <i class="fa-solid fa-user-plus"></i>
            </div>

            <h3 class="text-center fw-bold mt-3 mb-2">Kayıt Ol</h3>

            <p class="text-center text-muted mb-4">
              SalonRandevu hesabınızı oluşturarak sisteme kolayca giriş yapabilirsiniz.
            </p>

            <form>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-user text-purple me-1"></i>
                  Ad Soyad
                </label>

                <input type="text" class="form-control" id="registerName" placeholder="Adınızı ve soyadınızı giriniz">
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-envelope text-purple me-1"></i>
                  E-posta
                </label>

                <input type="email" class="form-control" id="registerEmail" placeholder="E-posta adresiniz">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">
                    <i class="fa-solid fa-lock text-purple me-1"></i>
                    Şifre
                  </label>

                  <input type="password" class="form-control" id="registerPassword" placeholder="Şifrenizi oluşturunuz">
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">
                    <i class="fa-solid fa-lock text-purple me-1"></i>
                    Şifre Tekrar
                  </label>

                  <input type="password" class="form-control" id="registerPasswordAgain"
                    placeholder="Şifrenizi tekrar giriniz">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">
                  <i class="fa-solid fa-id-card text-purple me-1"></i>
                  Rol Seçimi
                </label>

                <select class="form-select" id="registerRole">
                  <option value="">Seçiniz</option>
                  <option value="customer">Müşteri</option>
                  <option value="owner">Salon Sahibi</option>
                  <option value="admin">Admin</option>
                </select>
              </div>

              <button type="button" class="btn purple-btn w-100 auth-submit-btn" onclick="registerUser()">
                <i class="fa-solid fa-user-plus me-2"></i>
                Kayıt Ol
              </button>

            </form>

            <div class="auth-bottom-text">
              Zaten hesabınız var mı?
              <a href="login.html">Giriş Yap</a>
            </div>

          </div>

        </div>
      </div>

    </div>
  </section>

  <script>
    async function registerUser() {
      const fullName = document.getElementById("registerName").value;
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      const passwordAgain = document.getElementById("registerPasswordAgain").value;
      const role = document.getElementById("registerRole").value;

      if (fullName === "" || email === "" || password === "" || passwordAgain === "" || role === "") {
        alert("Lütfen tüm alanları doldurunuz.");
        return;
      }

      if (password !== passwordAgain) {
        alert("Şifreler aynı değil.");
        return;
      }

      const userData = {
        fullName: fullName,
        email: email,
        password: password,
        role: role
      };

      try {
        const response = await fetch("http://localhost:5000/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userData)
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Kayıt sırasında hata oluştu.");
          return;
        }

        alert("Kayıt başarılı. Şimdi giriş yapabilirsiniz.");
        window.location.href = "login.html";
      } catch (error) {
        alert("Backend bağlantı hatası.");
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
